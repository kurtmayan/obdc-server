services:
  api:
    build: .
    command: node dist/src/main.js
    ports:
      - '3000:3000'
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  worker:
    build: .
    command: node dist/src/worker.js
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
